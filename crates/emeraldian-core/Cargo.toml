[package]
name = "emeraldian-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Vault, index, markdown and graph engine for emeraldian"

[dependencies]
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
anyhow.workspace = true
unicode-width.workspace = true
# Excalidraw's Obsidian format stores its scene as LZ-String compressed base64.
lz-str.workspace = true
rust-stemmers.workspace = true

# A plain fsync, where the standard library offers only F_FULLFSYNC, which
# costs a hundred times as much: see `retrieval::segment::settle`. Already
# built for the terminal, through crossterm.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[features]
test-support = []
