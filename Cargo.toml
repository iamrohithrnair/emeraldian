[workspace]
resolver = "2"
members = ["crates/emeraldian-core", "crates/emeraldian-theme", "crates/emeraldian-agent", "crates/emeraldian"]

[workspace.package]
version = "0.5.0"
edition = "2024"
# Set by the dependency chain, not by this code: ratatui-image pulls
# icy_sixel, which pins quantette 0.5.1, which requires 1.90.
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/iamrohithrnair/emeraldian"
homepage = "https://emeraldian-tui.github.io"
# Not prefixed with the crate's own name: crates.io prints the name directly
# above this, and repeating it wastes the line people actually read.
description = "A terminal UI for your Obsidian vault: notes, live-preview markdown, backlinks and a force-directed graph"
# Five is the maximum crates.io accepts.
keywords = ["obsidian", "tui", "notes", "markdown", "graph"]
categories = ["command-line-utilities", "text-editors"]

[workspace.dependencies]
emeraldian-core = { path = "crates/emeraldian-core", version = "0.5.0" }
emeraldian-theme = { path = "crates/emeraldian-theme", version = "0.5.0" }
emeraldian-agent = { path = "crates/emeraldian-agent", version = "0.5.0" }

ratatui = "0.30"
crossterm = "0.29"
# Kitty, iTerm2 and sixel with a halfblocks fallback. Default features are off
# to keep the optional C bindings (libchafa, libsixel) out of the build, so the
# binary stays pure Rust and cross-compiles.
ratatui-image = { version = "11", default-features = false, features = [
    "crossterm",
    "image-defaults",
] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
anyhow = "1"
unicode-width = "0.2"
# The Unicode Bidirectional Algorithm (UAX #9). Pure Rust, no unsafe, and the
# same implementation the URL/IDNA stack uses; reordering bidi text correctly
# is a 1500-line job with a Unicode data table attached, not one worth redoing.
unicode-bidi = "0.3"
ureq = { version = "3", features = ["json"] }
lz-str = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# Dependencies are slow to compile but hot in the render loop; optimize them
# even in debug builds so `cargo run` is still smooth at 60fps.
[profile.dev.package."*"]
opt-level = 3
